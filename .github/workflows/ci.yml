name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    outputs:
      backend_image: ${{ steps.build_backend.outputs.image }}
      frontend_image: ${{ steps.build_frontend.outputs.image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('backend/go.mod', 'backend/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Cache npm dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Build backend Docker image
        id: build_backend
        run: |
          docker build -t ${{ secrets.DOCKER_REGISTRY }}/mockify-backend:${{ github.sha }} -f backend/Dockerfile .
          echo "image=${{ secrets.DOCKER_REGISTRY }}/mockify-backend:${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build frontend Docker image
        id: build_frontend
        run: |
          docker build -t ${{ secrets.DOCKER_REGISTRY }}/mockify-frontend:${{ github.sha }} -f frontend/Dockerfile .
          echo "image=${{ secrets.DOCKER_REGISTRY }}/mockify-frontend:${{ github.sha }}" >> $GITHUB_OUTPUT

  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v1.58.2

      - name: Run golangci-lint
        working-directory: backend
        run: golangci-lint run ./...

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npx eslint . --ext .ts,.tsx --max-warnings=0

  test:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('backend/go.mod', 'backend/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run Go unit tests with coverage
        working-directory: backend
        run: |
          go test ./... -coverprofile=coverage.out
          go tool cover -func=coverage.out | grep total | awk '{print $3}' | cut -d'%' -f1 > coverage.txt
          COVERAGE=$(cat coverage.txt)
          echo "Go test coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "Coverage $COVERAGE is below 80%"
            exit 1
          fi

      - name: Upload Go coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: backend/coverage.out

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend unit tests with coverage
        working-directory: frontend
        run: |
          npm run test -- --coverage --watchAll=false
          # Jest writes coverage summary to coverage/coverage-summary.json
          TOTAL=$(cat coverage/coverage-summary.json | jq .total.statements.pct)
          echo "Jest coverage: $TOTAL"
          if (( $(echo "$TOTAL < 80" | bc -l) )); then
            echo "Jest coverage $TOTAL is below 80%"
            exit 1
          fi

      - name: Upload frontend coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage

  integration_test:
    name: Integration & E2E Tests
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: mockify
          POSTGRES_PASSWORD: password
          POSTGRES_DB: mockify
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U mockify"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Pull built Docker images
        run: |
          docker pull ${{ secrets.DOCKER_REGISTRY }}/mockify-backend:${{ github.sha }}
          docker pull ${{ secrets.DOCKER_REGISTRY }}/mockify-frontend:${{ github.sha }}

      - name: Start stack with Docker Compose
        run: |
          docker compose -f docker-compose.yml up -d --build
        env:
          POSTGRES_USER: mockify
          POSTGRES_PASSWORD: password
          POSTGRES_DB: mockify

      - name: Wait for backend health endpoint
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:8080/healthz | grep -i ok; then
              echo "Backend is healthy"
              break
            fi
            echo "Waiting for backend..."
            sleep 2
          done

      - name: Run Go integration tests
        working-directory: backend
        run: go test -tags=integration ./... -count=1

      - name: Install Cypress
        working-directory: frontend
        run: npm ci && npx cypress install

      - name: Run Cypress end‑to‑end tests
        working-directory: frontend
        run: npx cypress run --config baseUrl=http://localhost:3000

      - name: Tear down Docker Compose
        if: always()
        run: docker compose -f docker-compose.yml down

  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [lint, test, integration_test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push backend image
        run: |
          docker push ${{ secrets.DOCKER_REGISTRY }}/mockify-backend:${{ github.sha }}

      - name: Push frontend image
        run: |
          docker push ${{ secrets.DOCKER_REGISTRY }}/mockify-frontend:${{ github.sha }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.28.0'

      - name: Configure kubeconfig
        run: |
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Deploy backend to staging
        run: |
          kubectl set image deployment/mockify-backend mockify-backend=${{ secrets.DOCKER_REGISTRY }}/mockify-backend:${{ github.sha }} --record
          kubectl rollout status deployment/mockify-backend --timeout=120s

      - name: Deploy frontend to staging
        run: |
          kubectl set image deployment/mockify-frontend mockify-frontend=${{ secrets.DOCKER_REGISTRY }}/mockify-frontend:${{ github.sha }} --record
          kubectl rollout status deployment/mockify-frontend --timeout=120s